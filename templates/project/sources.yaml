# Nguồn của wiki dự án "{{PROJECT_NAME}}". Mật khẩu / token đặt trong .env (không commit).
project:
  name: "{{PROJECT_NAME}}"
  timezone: Asia/Ho_Chi_Minh

git:
  autoCommit: true # pwiki collect / tracker push tự commit

# project-tracker: bỏ cả mục nếu dự án không báo cáo lên tracker
tracker:
  url: https://your-tracker.example.com # địa chỉ web của tracker (đọc /config.json)
  projectId: P01
  email: pl@example.com # tài khoản tracker của người duyệt (PL)

sources: []
